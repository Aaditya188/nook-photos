<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nook Photos</title>
  <meta name="description" content="Nook Photos — a private, self-hosted home for every photo and video you take. AI search, faces and places, original quality, on hardware you own.">
  <meta name="application-name" content="Nook Photos">
  <meta name="apple-mobile-web-app-title" content="Nook Photos">
  <!-- A private library should never be crawled or indexed. -->
  <meta name="robots" content="noindex, nofollow">
  <!-- Social cards. og:url is intentionally omitted: every install lives on a
       different host, so baking one in would point shares at someone else. -->
  <meta property="og:title" content="Nook Photos">
  <meta property="og:description" content="A private, self-hosted home for every photo and video you take — AI search, faces and places, original quality, on hardware you own.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Nook Photos">
  <meta name="twitter:description" content="A private, self-hosted home for every photo and video you take — AI search, faces and places, original quality, on hardware you own.">
  <meta name="twitter:image" content="/icons/icon-512.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%2357d38a'/%3E%3Cpath d='M7 22l5.5-5.5 3.5 3.5 5-5 4 4' stroke='%2306140c' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='11.5' cy='10.5' r='2' fill='%2306140c'/%3E%3C/svg%3E">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    (function () {
      try {
        var p = localStorage.getItem('nookTheme') || 'dark';
        var t = p === 'light' || p === 'dark'
          ? p
          : (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
